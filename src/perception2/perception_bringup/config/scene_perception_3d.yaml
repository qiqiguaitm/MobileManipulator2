# Scene Perception 3D 配置文件 (ROS2)

/**:
  ros__parameters:
    # 相机配置 (top | chassis | hand)
    camera_name: top

    # LiDAR 配置
    lidar_topic: /lidar/chassis/point_cloud
    enable_lidar: false             # 默认禁用 LiDAR (纯视觉模式)

    # Prompt 配置
    prompt_source: default         # service | topic | default
    prompt_topic: /user/prompt
    default_prompt: "box.bottle.cup.bag.bread.tissue.toy.barrel.chair.cabinet.picture.blackboard.package.carton"

    # 检测服务 (DINO-X)
    detector_url: http://192.168.112.14:10086
    detector_timeout: 3.0
    min_score: 0.25
    iou_threshold: 0.5
    detector_warmup: 2              # DINO-X 预热次数，0=禁用

    # 深度优化服务 (CDM)
    depth_optimizer_url: http://192.168.112.14:8086
    enable_depth_optimizer: true
    depth_optimizer_warmup: 2       # CDM 预热次数，0=禁用

    # 坐标系配置
    target_frame: base_link        # base_link | arm_base_link

    # 距离补偿参数 (相机测距系统性偏差修正)
    distance_offset: 0.30           # 默认 +30cm

    # 功能开关
    enable_accuracy_log: false

    # 自动检测配置
    auto_detect_rate: 10.0          # 自动检测频率 (Hz), 0=禁用
                                    # 性能模式配置:
                                    #   0 = 禁用，仅 service 模式
                                    #   5.0 = 标准模式
                                    #   10.0 = 高性能模式 (默认)

    # 时间同步参数
    sync_slop: 0.2                 # 同步容差 200ms
    data_max_age: 1.0              # 数据新鲜度阈值 1s
