# hdl_global_localization 参数
# 使用 BBS 引擎，避免 FPFH 参数 declare 问题；BBS 适合 2D 地面机器人
hdl_global_localization:
  ros__parameters:
    global_localization_engine: BBS
    globalmap_downsample_resolution: 0.5
    query_downsample_resolution: 0.5
    # BBS 参数
    bbs/max_range: 15.0
    bbs/min_tx: -50.0
    bbs/max_tx: 50.0
    bbs/min_ty: -50.0
    bbs/max_ty: 50.0
    bbs/min_theta: -3.15
    bbs/max_theta: 3.15
    # 地图Z切片范围 (map坐标系)，与ROS1 bbs_config.yaml保持一致
    bbs/map_min_z: -0.5
    bbs/map_max_z: 1.5
    bbs/map_width: 512
    bbs/map_height: 1024
    bbs/map_resolution: 0.5
    bbs/max_points_per_cell: 5
    bbs/map_pyramid_level: 6
    bbs/scan_min_z: -0.2
    bbs/scan_max_z: 0.2
