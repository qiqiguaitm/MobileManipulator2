# Nav2 配置: Smac 2D + MPPI (备选: TEB)
# 适用于二轮差速室内机器人
#
# 切换控制器: 当前使用 MPPI，TEB 配置在 controller_server 末尾注释保留
#   切回 TEB: 注释 MPPI FollowPath 块，取消注释 TEB FollowPath 块
#
# ⚠️ WARNING: 机器人足迹配置同步！
#   MPPI: 2 处 (local_costmap.footprint + global_costmap.footprint)
#   TEB:  3 处 (上述 2 处 + FollowPath.footprint_model.vertices)
# 当前尺寸: 0.809m x 0.62m
# 前边缘 x=0.434 (相机光学中心0.394m + 4cm安全余量)
# 后边缘 x=-0.375

amcl:
  ros__parameters:
    use_sim_time: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""
    frame_id: map
    topic_name: map

# ==================== 全局规划器: Smac 2D ====================
# 优化的 A* 算法，比 NavFn 更快更平滑
planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25                    # 目标容差
      downsample_costmap: false          # 不降采样，保持精度
      downsampling_factor: 1
      allow_unknown: true                # 允许穿越未知区域
      max_iterations: 1000000            # 最大迭代次数
      max_on_approach_iterations: 1000   # 接近目标时的迭代
      max_planning_time: 2.0             # 最大规划时间 (秒)
      cost_travel_multiplier: 2.0        # 代价乘数
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

# ==================== 局部控制器: MPPI ====================
# 采样式控制器，替代 TEB 的单弹性带优化
# 优势: 无局部最优/无震荡/原生costmap集成/天然多路径探索
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0           # 20Hz，MPPI 要求 period <= model_dt (0.05s)
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10            # 位置容差 10cm
      yaw_goal_tolerance: 0.175          # 朝向容差 ~10°
      stateful: true

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # ==================== 采样参数 ====================
      # 10m×10m 室内优化: 缩短视野、减少采样、更贪婪
      time_steps: 48                     # 轨迹步数 (56→48, 视野2.4s, 室内够用)
      model_dt: 0.05                     # 步长 50ms → 规划视野 2.4s
      batch_size: 1000                   # 采样轨迹数 (1500→1000, 小空间不需过多探索)
      iteration_count: 2                 # 每周期优化迭代次数
      temperature: 0.25                  # 选择贪婪度 (0.3→0.25, 更贪婪=更稳定轨迹)
      gamma: 0.015                       # 轨迹代价折扣因子
      motion_model: "DiffDrive"          # 差速运动模型
      visualize: false                   # true 可在 RViz 看候选轨迹 (调试用)
      regenerate_noises: false           # 复用噪声序列，更稳定
      retry_attempt_limit: 5

      # ==================== 速度约束 ====================
      # 参照 TEB: max_vel_x=0.3, max_vel_theta=0.5, acc_lim_x=0.5
      # MPPI 无显式加速度限制，通过降低 wz_max + 收紧噪声 std 隐式约束
      vx_max: 0.3                        # 最大前进速度 0.3m/s (与TEB一致)
      vx_min: -0.3                       # 最大后退速度 = 前进速度, 遇障碍快速后退脱困
      vy_max: 0.0                        # 差速机器人无横向速度
      wz_max: 0.6                        # 最大角速度 (TEB=0.5, +0.1给MPPI采样余量)

      # ==================== 采样噪声 ====================
      # 收紧噪声 = 隐式加速度约束 (MPPI无acc_lim，靠噪声控制平滑度)
      vx_std: 0.15                       # 线速度噪声 (0.2→0.15, 50%of vx_max, 更精细)
      vy_std: 0.0                        # 差速无横向
      wz_std: 0.4                        # 角速度噪声 (0.6→0.4, 67%of wz_max, 转弯更平滑)

      # ==================== 路径修剪 ====================
      prune_distance: 1.2               # 丢弃已通过路径段 (1.7→1.2, 小房间路径短)
      transform_tolerance: 0.1

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      # ==================== 评价函数 (Critics) ====================
      critics: [
        "ConstraintCritic",              # 运动学硬约束
        "ObstaclesCritic",               # 障碍物斥力 (直接几何碰撞检测)
        "CostCritic",                    # costmap 代价 (膨胀层感知)
        "GoalCritic",                    # 趋向目标
        "GoalAngleCritic",              # 到达时朝向对齐
        "PathFollowCritic",              # 跟随全局路径
        "PathAlignCritic",               # 轨迹-路径对齐
        "PathAngleCritic",               # 航向与路径方向一致
        "PreferForwardCritic"            # 优先前进 (差速关键)
      ]

      # --- 运动学约束 ---
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0                 # 违反约束的惩罚

      # --- 障碍物避让 (替代 TEB min_obstacle_dist=0.05) ---
      # 室内加强: 障碍物密度高，需要更大安全距离
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 2.5            # 斥力权重 (1.5→2.5, 室内远离障碍物)
        critical_weight: 20.0            # 极近距离时的惩罚权重
        consider_footprint: true         # 用矩形足迹碰撞检测，非圆形近似
        collision_cost: 10000.0          # 碰撞代价 (直接淘汰该轨迹)
        collision_margin_distance: 0.08  # 足迹安全余量 (0.05→0.08, 再次剐蹭后加大)
        near_goal_distance: 0.3          # 接近目标放宽距离 (0.5→0.3, 室内窄区到位前也要避障)

      # --- Costmap 代价 (感知膨胀层) ---
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0             # 高代价区域阈值
        consider_footprint: true         # 矩形足迹检查
        collision_cost: 1000000.0        # costmap 致命代价
        near_goal_distance: 0.8          # 接近目标降敏 (1.0→0.8, 室内晚一点才放松)

      # --- 到达目标 ---
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4       # 距目标 <1.4m 时激活

      # --- 目标朝向 (替代 TEB yaw_goal_tolerance) ---
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.5                 # 3.0→3.5, 室内到位朝向更精确
        threshold_to_consider: 0.5       # 距目标 <0.5m 时调整朝向

      # --- 路径跟随 (替代 TEB global_plan 跟踪) ---
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5          # 路径前方偏移点数
        threshold_to_consider: 1.4       # 接近目标时关闭 (与 GoalCritic 一致)

      # --- 路径对齐 (轨迹方向与全局路径吻合) ---
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0                # 与其他critic均衡 (14.0过高会主导代价函数)
        max_path_occupancy_ratio: 0.05   # 路径被占用比例阈值
        trajectory_point_step: 4         # 每隔 4 个轨迹点评估一次
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false     # 不强制路径点朝向

      # --- 航向角 (减少不必要的转向) ---
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.57      # 最大允许偏航 90°
        mode: 1                          # 0→1, 允许前进/后退双向评估，不再罚死后退轨迹

      # --- 前进偏好 (差速机器人核心) ---
      # 替代 TEB weight_kinematics_forward_drive=50 (相对尺度不同)
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.5                 # 2.5→1.5, 差速车后退代价低，室内常需后退调姿
        threshold_to_consider: 0.6       # 0.4→0.6, 更早允许后退

