# Nav2 配置: Smac 2D + MPPI (备选: TEB)
# 适用于二轮差速室内机器人
#
# ⚠️ WARNING: 机器人足迹配置同步！
#   MPPI: 2 处 (local_costmap.footprint + global_costmap.footprint)
#   TEB:  3 处 (local_costmap.footprint + global_costmap.footprint + FollowPath.footprint_model.vertices)
# 当前尺寸: 0.809m x 0.62m
# 前边缘 x=0.434 (相机光学中心0.394m + 4cm安全余量)
# 后边缘 x=-0.375

amcl:
  ros__parameters:
    use_sim_time: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""
    frame_id: map
    topic_name: map

# ==================== 全局规划器: Smac 2D ====================
# 优化的 A* 算法，比 NavFn 更快更平滑
planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25                    # 目标容差
      downsample_costmap: false          # 不降采样，保持精度
      downsampling_factor: 1
      allow_unknown: true                # 允许穿越未知区域
      max_iterations: 1000000            # 最大迭代次数
      max_on_approach_iterations: 1000   # 接近目标时的迭代
      max_planning_time: 2.0             # 最大规划时间 (秒)
      cost_travel_multiplier: 2.0        # 代价乘数
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

# ==================== 局部控制器: MPPI ====================
# 采样式控制器，天然适合差速底盘非线性约束
# 相比 TEB: 不需要显式足迹多边形(用 costmap 碰撞检测)，窄通道更稳定
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0           # 20Hz, 匹配 model_dt=0.05s
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10     # 0.3→0.10: 近目标微调只挪几cm，0.3太严
      movement_time_allowance: 20.0      # 15→20s: 给掉头/微调更多时间

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20            # 0.10→0.20: Nav2只需粗到位, 精度由阶段2/3保证
      yaw_goal_tolerance: 0.35           # 0.175→0.35 (~20°): 阶段2会精对齐
      stateful: true

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # ---- 采样参数 ----
      time_steps: 56                     # 48→56: horizon=2.8s, 0.3m/s看0.84m (室内转弯需要)
      model_dt: 0.05                     # 50ms 步长, 匹配 controller_frequency
      batch_size: 800                    # 1000→800: Jetson CPU 减20%负载, 差速2DOF够用
      iteration_count: 2                 # 2次迭代, 质量优于默认1次
      temperature: 0.25                  # 适度贪心, 室内不需要太多探索
      gamma: 0.015                       # 标准折扣因子
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: false
      retry_attempt_limit: 5

      # ---- 速度约束 ----
      vx_max: 0.3                        # 与底盘一致
      vx_min: -0.2                       # ⚠️ -0.1→-0.2: 允许适度后退以完成掉头
      vy_max: 0.0                        # 差速: 无横移
      wz_max: 0.5                        # ⚠️ 0.6→0.5: 与 behavior_server max_rotational_vel 同步

      # ---- 噪声标准差 ----
      vx_std: 0.15                       # vx_max 的 50%, 合理探索范围
      vy_std: 0.0
      wz_std: 0.3                        # 0.4→0.3: 匹配 wz_max 降低 (60% ratio)

      # ---- 路径跟踪 ----
      prune_distance: 1.5               # 1.2→1.5: 转弯时不过早丢弃路径点
      transform_tolerance: 0.1

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      # ---- Critics ----
      critics: [
        "ConstraintCritic", "ObstaclesCritic", "CostCritic",
        "GoalCritic", "GoalAngleCritic", "PathFollowCritic",
        "PathAlignCritic", "PathAngleCritic", "PreferForwardCritic"
      ]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 2.5
        critical_weight: 20.0
        consider_footprint: true         # 矩形机器人必须开
        collision_cost: 10000.0
        collision_margin_distance: 0.10  # ⚠️ 0.12→0.10: 减小碰撞余量，缓解接近目标时死区
        near_goal_distance: 0.5          # ⚠️ 0.3→0.5: 更早放松障碍惩罚，消除0.3-0.5m过渡带死区

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.8

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0                 # ⚠️ 8.0→5.0: 降低距离惩罚，允许旋转时短暂远离目标
        threshold_to_consider: 1.2       # 1.4→1.2: 室内短距离, 早点吸引到目标

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0                 # ⚠️ 3.5→5.0: 与GoalCritic平衡，差速车终点旋转对齐需要足够驱动力
        threshold_to_consider: 0.8       # ⚠️ 0.5→0.8: 提前开始航向对齐，避免到终点才急转

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 6          # 5→6: 56步horizon, 微调追踪参考点
        threshold_to_consider: 1.4

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 12         # 20→12: 56步中只跳12步, 对齐检查覆盖更完整
        use_path_orientations: false

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.57      # 90° 最大角度偏差
        mode: 1

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.5                 # ⚠️ 3.0→1.5: 降低前向偏好，允许MPPI采样后退轨迹完成掉头
        threshold_to_consider: 0.6       # ⚠️ 0.4→0.6: 更早关闭前向偏好，终点附近允许自由旋转

