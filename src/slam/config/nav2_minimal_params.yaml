# ==================== Local Costmap ====================
# 严格对齐 ROS1 costmap_3d_params.yaml local_costmap 段
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom                  # ROS1: odom
      robot_base_frame: base_link
      transform_tolerance: 0.8            # ROS1: 0.8 (覆盖 point cloud + HDL 延迟)
      update_frequency: 8.0               # ROS1: 8.0 (与控制频率同步)
      publish_frequency: 0.5              # ROS1: 0.5
      rolling_window: true
      width: 4                            # ROS1: 4.0 (前方2m，匹配 obstacle_range)
      height: 4                           # ROS1: 4.0
      resolution: 0.05                    # ROS1: 0.05
      track_unknown_space: false          # ROS1: false
      # 矩形 footprint: 0.809m x 0.62m (前边缘=相机+4cm余量 0.434m)
      footprint: "[[-0.375, -0.31], [-0.375, 0.31], [0.434, 0.31], [0.434, -0.31]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      # ROS1 local costmap 的 static_layer: enabled=false，不需要
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true   # ROS1: true
        track_unknown_space: false         # ROS1: false
        observation_sources: "scan"
        scan:
          topic: /scan
          max_obstacle_height: 1.5         # ROS1: 1.5
          min_obstacle_height: 0.0         # ROS1: 0.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0          # ROS1: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5          # ROS1: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.40             # ROS1: 0.40 (inscribed 0.31 + 0.09 余量)
        cost_scaling_factor: 5.0           # ROS1: 5.0 (代价衰减更快，减少振荡)

# ==================== Global Costmap ====================
# 严格对齐 ROS1 costmap_3d_params.yaml global_costmap 段
# 关键: ROS1 用 odom + rolling_window + obstacle_layer, 全局规划器能看到实时障碍物
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom                   # ROS1: odom (避开 map->odom TF 延迟)
      robot_base_frame: base_link
      transform_tolerance: 0.5            # ROS1: 0.5
      update_frequency: 3.0               # ROS1: 3.0
      publish_frequency: 0.5              # ROS1: 0.5
      rolling_window: true                # ROS1: true (关键! 之前 ROS2 错误地用了 false)
      width: 20                           # ROS1: 20.0
      height: 20                          # ROS1: 20.0
      resolution: 0.1                     # ROS1: 0.1 (全局规划不需要高精度)
      track_unknown_space: false          # ROS1: false
      # 矩形足迹: 0.809m x 0.62m
      footprint: "[[-0.375, -0.31], [-0.375, 0.31], [0.434, 0.31], [0.434, -0.31]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /map
        track_unknown_space: false        # ROS1: false
        trinary_costmap: true             # ROS1: true (关键!)
        lethal_cost_threshold: 100        # ROS1: 100
      # 关键! ROS1 全局 costmap 有 obstacle_layer, 全局规划器能绕过实时障碍
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true   # ROS1: true
        track_unknown_space: false
        observation_sources: "scan"
        scan:
          topic: /scan
          max_obstacle_height: 1.5         # ROS1: 1.5
          min_obstacle_height: 0.0         # ROS1: 0.0
          clearing: true                   # ROS1: true (清除动态障碍物移走后的区域)
          marking: true                    # ROS1: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0          # ROS1: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0          # ROS1: 3.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.45            # ROS1: 0.45
        cost_scaling_factor: 3.0          # ROS1: 3.0

# ==================== 恢复行为服务器 ====================
# 对齐 ROS1 move_base_params.yaml 恢复行为
behavior_server:
  ros__parameters:
    use_sim_time: false
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    # ROS1 rotate_recovery: max_vel_th=0.8, 但 TEB max_vel_theta=0.5
    # 恢复行为允许更快的旋转速度来脱困
    max_rotational_vel: 0.8              # ROS1: rotate_recovery max_vel_th=0.8
    min_rotational_vel: 0.4              # ROS1: rotate_recovery min_vel_th=0.4
    rotational_acc_lim: 3.0              # ROS1: rotate_recovery acc_lim_th=3.0
    simulate_ahead_time: 1.5
    # backup 线速度约束
    max_linear_vel: 0.2
    min_linear_vel: 0.05
    linear_acc_lim: 0.5
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

# ==================== 行为树导航 ====================
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom/fused
    bt_loop_duration: 100              # BT tick 间隔 100ms
    default_server_timeout: 500        # action server 响应超时 500ms
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 5.0
