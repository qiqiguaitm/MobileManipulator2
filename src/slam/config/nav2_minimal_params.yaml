# Nav2 配置: NavFn (Dijkstra) + TEB (备选: MPPI)
# 严格对齐 ROS1 _MobileManipulator 导航配置
# 参考: costmap_3d_params.yaml + move_base_params.yaml + teb_local_planner.yaml
#
# ⚠️ WARNING: 机器人足迹配置同步！
#   TEB:  3 处 (local_costmap.footprint + global_costmap.footprint + FollowPath.footprint_model.vertices)
#   MPPI: 2 处 (local_costmap.footprint + global_costmap.footprint)
# 当前尺寸: 0.809m x 0.62m
# 前边缘 x=0.434 (相机光学中心0.394m + 4cm安全余量)
# 后边缘 x=-0.375

amcl:
  ros__parameters:
    use_sim_time: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""
    frame_id: map
    topic_name: map

# ==================== 全局规划器: NavFn (Dijkstra) ====================
# 对齐 ROS1 global_planner/GlobalPlanner (use_dijkstra=true)
planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.1                     # ROS1: default_tolerance=0.1
      use_astar: false                   # ROS1: use_dijkstra=true → use_astar=false
      allow_unknown: false               # ROS1: allow_unknown=false

# ==================== 局部控制器: TEB ====================
# 严格对齐 ROS1 teb_local_planner.yaml
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 8.0            # ROS1: controller_frequency=8.0 (launch覆盖)
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10     # 近目标微调只挪几cm
      movement_time_allowance: 20.0      # 给掉头/微调更多时间

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20            # Nav2 粗到位, 精度由阶段2/3保证
      yaw_goal_tolerance: 0.35           # ~20°: 阶段2会精对齐
      stateful: true

    FollowPath:
      plugin: "teb_local_planner::TebLocalPlannerROS"

      # ---- 机器人约束 (ROS1 对齐) ----
      max_vel_x: 0.3                     # ROS1: 0.3 (launch可覆盖为0.2)
      max_vel_x_backwards: 0.15          # ROS1: 0.15
      max_vel_y: 0.0                     # ROS1: 0.0 (差速)
      max_vel_theta: 0.5                 # ROS1: 0.5
      acc_lim_x: 0.5                     # ROS1: 0.5
      acc_lim_y: 0.0                     # ROS1: 0.0
      acc_lim_theta: 1.0                 # ROS1: 1.0
      min_turning_radius: 0.0            # ROS1: 0.0 (差速可原地旋转)
      wheelbase: 0.0                     # ROS1: 0.0
      cmd_angle_instead_rotvel: false    # ROS1: false

      # ---- 足迹 (0.809m x 0.62m, ROS2 更新了前边缘) ----
      # ROS1: [[-0.375,-0.31],[-0.375,0.31],[0.375,0.31],[0.375,-0.31]]
      # ROS2: 前边缘 0.375→0.434 (相机+4cm安全余量)
      footprint_model.type: "polygon"
      footprint_model.vertices: "[[-0.375, -0.31], [-0.375, 0.31], [0.434, 0.31], [0.434, -0.31]]"

      # ---- 目标容差 (ROS1 对齐) ----
      xy_goal_tolerance: 0.10            # ROS1: 0.10
      yaw_goal_tolerance: 0.175          # ROS1: 0.175 (~10°)
      free_goal_vel: false               # ROS1: false

      # ---- 路径跟踪 (ROS1 对齐) ----
      global_plan_overwrite_orientation: false   # ROS1: false (避免起点转圈)
      global_plan_viapoint_sep: 0.5      # ROS1: 0.5 (ARM优化)
      via_points_ordered: true           # ROS1: true
      max_global_plan_lookahead_dist: 2.0  # ROS1: 2.0

      # ---- 轨迹参数 (ROS1 对齐) ----
      teb_autosize: 1.0                  # ROS1: true
      dt_ref: 0.3                        # ROS1: 0.3 (ARM优化)
      dt_hysteresis: 0.1                 # ROS1: 0.1 (ARM优化)
      min_samples: 3                     # ROS1: 3 (ARM优化)
      allow_init_with_backwards_motion: false  # ROS1: false

      # ---- 障碍物 (ROS1 对齐) ----
      min_obstacle_dist: 0.05            # ROS1: 0.05
      inflation_dist: 0.2                # ROS1: 0.2
      include_costmap_obstacles: true    # ROS1: true
      costmap_obstacles_behind_robot_dist: 1.0  # ROS1: 1.0 (ARM优化)
      obstacle_poses_affected: 15        # ROS1: 15
      include_dynamic_obstacles: false   # ROS1: false

      # ---- 优化 (ROS1 对齐) ----
      no_inner_iterations: 3             # ROS1: 3 (ARM优化)
      no_outer_iterations: 2             # ROS1: 2 (ARM优化)
      optimization_activate: true
      optimization_verbose: false
      penalty_epsilon: 0.1               # ROS1: 0.1
      weight_max_vel_x: 2.0             # ROS1: 2.0
      weight_max_vel_theta: 1.0         # ROS1: 1.0
      weight_acc_lim_x: 3.0             # ROS1: 3.0
      weight_acc_lim_theta: 5.0         # ROS1: 5.0
      weight_kinematics_nh: 1000.0      # ROS1: 1000.0
      weight_kinematics_forward_drive: 50.0  # ROS1: 50.0
      weight_kinematics_turning_radius: 0.0  # ROS1: 0.0
      weight_optimaltime: 0.5           # ROS1: 0.5
      weight_shortest_path: 0.0         # ROS1: 0.0
      weight_obstacle: 15.0             # ROS1: 15.0
      weight_inflation: 0.1             # ROS1: 0.1
      weight_dynamic_obstacle: 10.0     # ROS1: 10.0
      weight_dynamic_obstacle_inflation: 0.2  # ROS1: 0.2
      weight_viapoint: 5.0              # ROS1: 5.0
      weight_adapt_factor: 2.0          # ROS1: 2.0

      # ---- 震荡恢复 (ROS1 对齐) ----
      oscillation_recovery: true         # ROS1: true
      oscillation_v_eps: 0.05            # ROS1: 0.05
      oscillation_omega_eps: 0.05        # ROS1: 0.05
      oscillation_recovery_min_duration: 5.0  # ROS1: 5.0
      oscillation_filter_duration: 5.0   # ROS1: 5.0

      # ---- 可行性检查 (ROS1 对齐) ----
      feasibility_check_no_poses: 4      # ROS1: 4
      publish_feedback: false            # ROS1: false
      shrink_horizon_backup: true        # ROS1: true
      shrink_horizon_min_duration: 3.0   # ROS1: 3.0

      # ---- 并行规划 (ROS1 对齐) ----
      enable_homotopy_class_planning: false  # ROS1: false (ARM性能不足)
      enable_multithreading: true        # ROS1: true
      max_number_classes: 2              # ROS1: 2
      selection_cost_hysteresis: 1.0     # ROS1: 1.0
      selection_prefer_initial_plan: 1.0 # ROS1: 1.0

