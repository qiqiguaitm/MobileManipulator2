# Nav2 配置: Smac 2D + TEB
# 适用于二轮差速室内机器人
# TEB 参数从 ROS1 move_base 迁移
#
# ⚠️ WARNING: 机器人足迹配置在 3 处重复！修改时必须同步：
#   1. controller_server.FollowPath.footprint_model.vertices (L85)
#   2. local_costmap.footprint (L172)
#   3. global_costmap.footprint (L212)
# 当前尺寸: 0.809m x 0.62m
# 前边缘 x=0.434 (相机光学中心0.394m + 4cm安全余量)
# 后边缘 x=-0.375

amcl:
  ros__parameters:
    use_sim_time: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""
    frame_id: map
    topic_name: map

# ==================== 全局规划器: Smac 2D ====================
# 优化的 A* 算法，比 NavFn 更快更平滑
planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25                    # 目标容差
      downsample_costmap: false          # 不降采样，保持精度
      downsampling_factor: 1
      allow_unknown: true                # 允许穿越未知区域
      max_iterations: 1000000            # 最大迭代次数
      max_on_approach_iterations: 1000   # 接近目标时的迭代
      max_planning_time: 2.0             # 最大规划时间 (秒)
      cost_travel_multiplier: 2.0        # 代价乘数
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

# ==================== 局部规划器: TEB ====================
# 从 ROS1 move_base TEB 参数迁移
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0           # TEB 典型频率 10Hz
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10            # 位置容差 10cm
      yaw_goal_tolerance: 0.175          # 朝向容差 ~10°
      stateful: true

    FollowPath:
      plugin: "teb_local_planner::TebLocalPlannerROS"

      # ==================== 机器人约束 ====================
      max_vel_x: 0.3                     # 最大前进速度 0.3m/s
      max_vel_x_backwards: 0.15          # 允许适度后退 0.15m/s
      max_vel_y: 0.0                     # 差速机器人无横向速度
      max_vel_theta: 0.5                 # 最大角速度 0.5rad/s

      # 加速度限制
      acc_lim_x: 0.5                     # 线加速度 0.5m/s²
      acc_lim_y: 0.0
      acc_lim_theta: 1.0                 # 角加速度 1.0rad/s²

      # 差速机器人运动学
      min_turning_radius: 0.0            # 可原地转向
      wheelbase: 0.0
      cmd_angle_instead_rotvel: false

      # 机器人足迹 (76.9cm x 62cm 矩形，前边缘=相机光学中心)
      footprint_model.type: "polygon"
      footprint_model.vertices: "[[-0.375, -0.31], [-0.375, 0.31], [0.434, 0.31], [0.434, -0.31]]"

      # ==================== 目标容差 ====================
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.175
      free_goal_vel: false

      # ==================== 路径跟踪 ====================
      global_plan_overwrite_orientation: false
      global_plan_viapoint_sep: 0.5
      via_points_ordered: true
      max_global_plan_lookahead_dist: 2.0

      # ==================== 轨迹参数 ====================
      teb_autosize: 1.0
      dt_ref: 0.3
      dt_hysteresis: 0.1
      min_samples: 3
      allow_init_with_backwards_motion: false

      # ==================== 障碍物参数 ====================
      min_obstacle_dist: 0.05            # footprint边缘到障碍物最小距离 5cm
      inflation_dist: 0.2                # 膨胀距离 20cm
      include_costmap_obstacles: true
      costmap_obstacles_behind_robot_dist: 1.0
      obstacle_poses_affected: 15
      include_dynamic_obstacles: false

      # ==================== 优化参数 ====================
      no_inner_iterations: 3
      no_outer_iterations: 2
      optimization_activate: true
      optimization_verbose: false

      penalty_epsilon: 0.1
      weight_max_vel_x: 2.0
      weight_max_vel_theta: 1.0
      weight_acc_lim_x: 3.0
      weight_acc_lim_theta: 5.0
      weight_kinematics_nh: 1000.0
      weight_kinematics_forward_drive: 50.0
      weight_kinematics_turning_radius: 0.0
      weight_optimaltime: 0.5
      weight_shortest_path: 0.0
      weight_obstacle: 15.0
      weight_inflation: 0.1
      weight_dynamic_obstacle: 10.0
      weight_dynamic_obstacle_inflation: 0.2
      weight_viapoint: 5.0
      weight_adapt_factor: 2.0

      # ==================== 震荡恢复 ====================
      oscillation_recovery: true
      oscillation_v_eps: 0.05
      oscillation_omega_eps: 0.05
      oscillation_recovery_min_duration: 5.0
      oscillation_filter_duration: 5.0

      # ==================== 可行性检查 ====================
      feasibility_check_no_poses: 4
      publish_feedback: false
      shrink_horizon_backup: true
      shrink_horizon_min_duration: 3.0

      # ==================== 并行规划 ====================
      enable_homotopy_class_planning: false
      enable_multithreading: true
      max_number_classes: 2
      selection_cost_hysteresis: 1.0
      selection_prefer_initial_plan: 1.0

# ==================== Local Costmap ====================
# 严格仿照 ROS1 costmap_3d_params.yaml
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom                  # ROS1: odom (避开 map->odom TF 延迟)
      robot_base_frame: base_link
      transform_tolerance: 0.5            # 500ms 容忍 HDL/FastLIO 时间戳差异
      update_frequency: 8.0               # ROS1: 8.0
      publish_frequency: 0.5              # ROS1: 0.5
      rolling_window: true
      width: 4                            # ROS1: 4.0 (4m x 4m 局部地图)
      height: 4
      resolution: 0.05                    # ROS1: 0.05
      # 矩形足迹: 0.809m x 0.62m (前边缘=相机+4cm余量 0.434m)
      footprint: "[[-0.375, -0.31], [-0.375, 0.31], [0.434, 0.31], [0.434, -0.31]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      # ROS1 local costmap 不使用 static_layer (rolling window场景)
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true   # 清除机器人足迹内的障碍物点云
        track_unknown_space: false         # ROS1: 不跟踪未知区域
        observation_sources: "scan"
        scan:
          topic: /scan
          max_obstacle_height: 1.5         # ROS1: 1.5
          min_obstacle_height: 0.0         # ROS1: 0.0 (lidar高度约0.06m)
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0          # ROS1: raytrace_range=3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5          # ROS1: obstacle_range=2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.40             # ROS1: 0.40
        cost_scaling_factor: 5.0           # ROS1: 5.0

# ==================== Global Costmap ====================
# 严格仿照 ROS1 costmap_3d_params.yaml
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map                   # ROS1 用 odom，但 Nav2 的 static_layer 必须用 map
      robot_base_frame: base_link
      transform_tolerance: 0.5            # 500ms 容忍 HDL/FastLIO 时间戳差异
      update_frequency: 3.0               # ROS1: 3.0
      publish_frequency: 0.5              # ROS1: 0.5
      rolling_window: false               # ROS1: rolling_window=true+global_frame=odom，Nav2用static_map=map
      track_unknown_space: false          # ROS1: 不跟踪未知区域
      # 矩形足迹: 0.809m x 0.62m (前边缘=相机+4cm余量 0.434m)
      footprint: "[[-0.375, -0.31], [-0.375, 0.31], [0.434, 0.31], [0.434, -0.31]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        track_unknown_space: false        # ROS1: 不跟踪未知空间
        # ROS1 trinary_costmap=true, lethal_cost_threshold=100
      # 实时障碍物层 (让全局规划器绕行临时障碍物)
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true                     # ROS1: enabled=true
        footprint_clearing_enabled: true
        track_unknown_space: false
        observation_sources: "scan"
        scan:
          topic: /scan
          max_obstacle_height: 1.5        # ROS1: 1.5
          min_obstacle_height: 0.0        # ROS1: 0.0 (lidar高度约0.06m)
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0         # ROS1: raytrace_range=5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0         # ROS1: obstacle_range=3.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45            # ROS1: 0.45
        cost_scaling_factor: 3.0          # ROS1: 3.0

# ==================== 恢复行为服务器 ====================
# 提供 spin, backup, wait 等恢复行为的 action server
behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

# ==================== 行为树导航 ====================
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom/fused
    # 使用 GoalUpdated 的 BT，避免 Humble 中未注册的 GlobalUpdatedGoal 报错
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 5.0
