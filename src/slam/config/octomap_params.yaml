# Octomap Server 参数配置
# 3D点云 → 2D占用栅格地图
# 从ROS1 fastlio2pgo.launch迁移

octomap_server:
  ros__parameters:
    # ==================== 坐标系 ====================
    frame_id: "camera_init"

    # ==================== 分辨率 ====================
    resolution: 0.05                 # 5cm分辨率

    # ==================== 传感器模型 ====================
    sensor_model:
      max_range: 20.0                # 最大感知距离20m
      hit: 0.7                       # 命中概率
      miss: 0.4                      # 未命中概率
      min: 0.12                      # 最小占用概率
      max: 0.97                      # 最大占用概率

    # ==================== 2D投影高度过滤 ====================
    # 只保留机器人行走高度的障碍物
    occupancy_min_z: 0.1             # 过滤地面反射 (>10cm)
    occupancy_max_z: 1.2             # 过滤天花板 (<1.2m)

    # ==================== 2D地图投影 ====================
    project_2d_map: true             # 启用2D投影

    # ==================== 增量更新 ====================
    latch: true                      # 锁存最新地图
