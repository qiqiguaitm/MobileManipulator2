# perception_grasp.yaml - 抓取感知节点配置 (ROS2)

perception_grasp_node:
  ros__parameters:
    # 相机 Topic 配置
    camera:
      rgb_topic: '/camera/hand/color/image_raw'
      depth_topic: '/camera/hand/aligned_depth_to_color/image_raw'
      camera_info_topic: '/camera/hand/color/camera_info'

    # 触发模式配置
    trigger:
      realtime_mode:
        enabled: false
        rate: 1.0
        default_prompt: 'pen.box.phone.bottle.toy'
        prompt_topic: '/usr/prompt/grasp'

    # 检测服务配置
    services:
      grasp:
        # server_list: 默认自动发现 perception/config/server_grasp.json
        model_name: 'full'
        warmup: true
      detector_type: 'sam3'  # dinox | sam3
      dinox:
        url: 'http://192.168.112.14:10086'
      sam3:
        url: 'http://192.168.112.14:8080'
      cdm:
        url: 'http://192.168.112.14:8081'
        enabled: true

    # 深度有效范围 (米)
    depth:
      min_depth: 0.20
      max_depth: 2.0

    # Chosen Object 选择策略
    chosen_policy:
      grasp_score_weight: 0.2
      distance_weight: 0.8
      distance_mode: 'reciprocal'
      normalize_distance: true
      debug: false

    # 过滤参数
    filter:
      min_grasp_score: 0.3
      min_object_score: 0.25
      max_gripper_width: 0.090  # 夹爪最大宽度 (米), Piper 物理限制 90mm

      # 规则2: bbox 短边尺寸过滤（基于 mask rotated bbox）
      bbox_size_filter:
        enabled: true
        size_ratio: 2.0           # 短边阈值 = max_gripper_width * size_ratio
                                   # 例：90mm * 2.0 = 180mm，超过此值的物体会被过滤

      # 规则1: Affordance 旋转矩形过滤
      affordance_mask_overlap:
        enabled: false            # 临时禁用，调试 score=0 问题
        expand_ratio: 1.5
        overlap_threshold: 0.9
        rect_height_ratio: 0.4

    # 输出坐标系
    frame_id: 'camera/hand_color_optical_frame'


perception_grasp_rviz_node:
  ros__parameters:
    frame_id: 'hand_camera_color_optical_frame'
    pointcloud_scale: 0.5
    marker_lifetime: 3.0
    depth_min: 0.001
    depth_max: 2.0
    temporal_filter_size: 3

    rgb_topic: '/camera/hand/color/image_raw'
    depth_topic: 'perception_grasp_node/depth'
    result_topic: 'perception_grasp_node/result'
    camera_info_topic: '/camera/hand/color/camera_info'
