# Approach Navigator 配置
# 从 ROS1 ThreeStageConfig 迁移，LiDAR 替换为 Camera 点云处理

approach_navigator:
  ros__parameters:
    # ============================================================
    # 阶段1: Nav2 导航到接近点
    # ============================================================
    # 接近距离必须 > global_costmap inflation_radius (0.45m)
    approach_distance: 0.40           # 接近点到目标的距离 (米)，需 > global inflation 0.45m
    nav_timeout: 60.0                 # 导航超时时间 (秒)

    # ============================================================
    # 阶段2: 对齐 (纯 P 控制)
    # ============================================================
    align_tolerance: 0.087            # 对齐容差 5度 (弧度)
    align_kp: 1.5                     # P 增益 (纯 P，差速底盘直接接受角速度)
    align_max_omega: 0.5              # 最大角速度 (弧度/秒)
    align_min_omega: 0.03             # 死区角速度 (弧度/秒)，克服静摩擦
    align_timeout: 15.0               # 对齐超时时间 (秒)
    min_align_distance: 0.10          # 距离小于此值跳过对齐 (米)
    align_settle_time: 0.8            # 粗对齐后停稳等待 (秒)，让IMU/里程计收敛
    depth_warmup_frames: 5            # 深度传感器预热帧数，丢弃前N帧不稳定数据
    camera_lateral_offset: 0.033      # 机器人中心在相机光学系的x偏移 (米，x=右，+0.033=中心在相机右侧3.3cm，来源：外参translation.x)

    # ============================================================
    # 阶段3: 精确接近
    # ============================================================
    final_approach_speed: 0.10        # 最大前进速度 (米/秒)
    final_approach_distance: 0.04     # 目标距离：前边缘到目标 + 3cm安全余量 (米)
    emergency_stop_distance: 0.03     # 紧急刹车距离 (米)
    speed_decel_rate: 0.5             # 最大减速率 (米/秒²)
    final_approach_timeout: 15.0      # 精确接近超时 (秒)

    # ============================================================
    # 深度传感器参数
    # ============================================================
    depth_topic: "/camera/chassis/aligned_depth_to_color/image_raw"
    depth_min_valid: 0.10             # 最小有效深度，D435 约 0.1m (米)
    depth_max_valid: 1.0              # 最大有效深度 (米)
    depth_data_timeout: 0.5           # 深度数据超时判定 (秒)

    # ============================================================
    # 点云处理参数
    # ============================================================
    # 降采样: 减少计算量，4 表示每 4 个像素取 1 个
    depth_downsample: 4

    # 相机坐标系: y 向下为正, 相机离地约 15cm → 地面在 y ≈ +0.15m
    # ROI 上限必须 > depth_ground_max_height, 才能让地面点进入 RANSAC 去除
    depth_ground_max_height: 0.158      # 地面高度: +15cm (相机离地15cm, y向下为正)
    depth_obstacle_min_height: -0.35   # ROI 上方截止: -50cm (排除50cm以上高处, y向上为负)
    depth_obstacle_max_height: 0.22    # ROI 下方截止: +22cm (包含地面+7cm余量, 供RANSAC使用)

    # 检测范围: 前方 |y| < 此值的范围
    depth_detect_width: 0.8           # 检测宽度 (米)，左右各此值

    # ============================================================
    # 去噪参数 (半径异常值去除)
    # ============================================================
    outlier_radius: 0.05              # 搜索半径 (米)
    outlier_min_neighbors: 5          # 最少邻居数，不足则判为噪点 (5=更强空间一致性)

    # ============================================================
    # RANSAC 地面拟合参数
    # ============================================================
    ransac_distance_threshold: 0.01   # 点到平面距离阈值 (米)
    ransac_max_iterations: 80         # 最大迭代次数
    ransac_min_inlier_ratio: 0.3      # 最小内点比例，低于则拟合失败
    ground_candidate_margin: 0.08     # 地面候选点 y 容差 (米)，y >= ground_max - margin
    ground_inlier_min_dist: -0.01     # 地面内点有符号距离下限 (米，平面上方1cm)
    ground_inlier_max_dist: 0.05      # 地面内点有符号距离上限 (米，平面下方5cm)

    # ============================================================
    # 聚类参数
    # ============================================================
    cluster_tolerance: 0.05           # DBSCAN eps / KDTree 邻域半径 (米)
    cluster_min_size: 20              # 最小聚类点数

    # ============================================================
    # 机器人几何参数
    # ============================================================
    # robot_front_offset: 导航计算接近点用 (total_offset = robot_front_offset + approach_distance)
    # 相机距离: Phase 3 精确接近直接使用相机测量距离，不加 offset
    robot_front_offset: 0.5         # base_link 到机器人前边缘 (用于导航)

    # ============================================================
    # 控制参数
    # ============================================================
    control_rate: 30.0                # 控制循环频率 (Hz)

    # ============================================================
    # TF 坐标系
    # ============================================================
    map_frame: "map"                  # 地图坐标系
    base_frame: "base_link"           # 机器人基座坐标系
