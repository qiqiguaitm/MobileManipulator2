# Approach Navigator 配置
# 从 ROS1 ThreeStageConfig 迁移，LiDAR 替换为 Camera 点云处理

approach_navigator:
  ros__parameters:
    # ============================================================
    # 阶段1: Nav2 导航到接近点
    # ============================================================
    # 接近距离必须 > local_costmap inflation_radius (0.35m)
    approach_distance: 0.45           # 接近点到目标的距离 (米)
    nav_timeout: 60.0                 # 导航超时时间 (秒)

    # ============================================================
    # 阶段2: 对齐 (PD 控制器)
    # ============================================================
    align_tolerance: 0.087            # 对齐容差 5度 (弧度)
    align_kp: 1.0                     # P 增益
    align_kd: 0.1                     # D 增益
    align_max_omega: 0.5              # 最大角速度 (弧度/秒)
    align_timeout: 10.0               # 对齐超时时间 (秒)
    min_align_distance: 0.10          # 距离小于此值跳过对齐 (米)

    # ============================================================
    # 阶段3: 精确接近
    # ============================================================
    final_approach_speed: 0.10        # 最大前进速度 (米/秒)
    final_approach_distance: 0.08     # 目标距离：前边缘到目标 (米)
    emergency_stop_distance: 0.03     # 紧急刹车距离 (米)
    speed_decel_rate: 0.5             # 最大减速率 (米/秒²)
    final_approach_timeout: 15.0      # 精确接近超时 (秒)

    # ============================================================
    # 深度传感器参数
    # ============================================================
    depth_topic: "/camera/chassis/aligned_depth_to_color/image_raw"
    depth_min_valid: 0.10             # 最小有效深度，D435 约 0.1m (米)
    depth_max_valid: 2.0              # 最大有效深度 (米)
    depth_data_timeout: 0.5           # 深度数据超时判定 (秒)

    # ============================================================
    # 点云处理参数
    # ============================================================
    # 降采样: 减少计算量，4 表示每 4 个像素取 1 个
    depth_downsample: 4

    # 地面过滤: base_link 坐标系中 z < 此值为地面
    depth_ground_max_height: 0.15     # 地面最高高度 (米)

    # 障碍物过滤: 只保留此高度范围内的点
    depth_obstacle_min_height: 0.15   # 障碍物最低高度 (米)，需高于地面噪声
    depth_obstacle_max_height: 1.5    # 障碍物最高高度 (米)

    # 检测范围: 前方 |y| < 此值的范围
    depth_detect_width: 0.4           # 检测宽度 (米)，左右各此值

    # ============================================================
    # 外参标定文件
    # ============================================================
    extrinsics_file: "/home/didi/workspace/MobileManipulator2/src/perception/config/extrinsics_chassis_camera_optical_frame_to_base_link.yaml"

    # ============================================================
    # 机器人几何参数
    # 来源: 外参标定文件计算
    # ============================================================
    # 计算方法: 对外参变换求逆，得到相机在 base_link 中的位置
    #   T_base_to_optical = T_optical_to_base^(-1)
    #   结果: x=0.394m + 4cm安全余量 = 0.434m
    camera_forward_offset: 0.394      # 相机光学中心相对 base_link 前向偏移 (米)

    # 机器人前边缘 = 相机光学中心 + 4cm余量 (相机外壳 + 安全)
    #   nav2 footprint: "[[-0.375, -0.31], [-0.375, 0.31], [0.434, 0.31], [0.434, -0.31]]"
    robot_front_offset: 0.434         # base_link 到机器人前边缘距离 (米)

    # ============================================================
    # 控制参数
    # ============================================================
    control_rate: 50.0                # 控制循环频率 (Hz)

    # ============================================================
    # TF 坐标系
    # ============================================================
    map_frame: "map"                  # 地图坐标系
    base_frame: "base_link"           # 机器人基座坐标系
