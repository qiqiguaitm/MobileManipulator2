robot_manager_node:
  ros__parameters:
    tracked_objects_topic: "/object_tracker_node/tracked_objects"
    min_track_score: 0.3
    min_position_confidence: 0.3
    min_distance: 0.3          # m
    max_distance: 3.0          # m
    max_attempts: 3
    max_picks_per_nav: 10
    scan_stable_frames: 3
    scan_stable_timeout: 3.0   # s
    pick_speed: 30             # 1-100%
    lift_height: 200.0         # mm (pass-through to Piper)
    observe_prompt: "bottle.cup.box"
    observe_timeout: 10.0      # s
    pick_timeout: 60.0         # s
    place_timeout: 30.0        # s
    nav_timeout: 120.0         # s
    max_consecutive_failures: 3
    error_cooldown: 5.0        # s
    max_error_retries: 3
    status_rate: 1.0           # Hz
